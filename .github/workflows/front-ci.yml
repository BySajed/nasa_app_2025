name: Front CI

on:
  workflow_dispatch:
  push:
    branches: [ "main", "ci" ]
    paths: [ "front/**" ]

env:
  VITE_MAPBOX_ACCESS_TOKEN: ${{ secrets.VITE_MAPBOX_ACCESS_TOKEN }}
  VITE_API_URL: ${{ secrets.VITE_API_URL }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create .env file
        run: |
          touch ./front/.env
          echo "VITE_MAPBOX_ACCESS_TOKEN=${{ secrets.VITE_MAPBOX_ACCESS_TOKEN }}" >> ./front/.env
          echo "VITE_API_URL=${{ secrets.VITE_API_URL }}" >> ./front/.env

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./front
          push: true
          secrets: "env_file=./front/.env"
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/expedition25:front

      - name: Redeploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOSTNAME }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PWD }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            cd expedition25/
            docker compose pull
            docker compose up -d
            docker image prune -f